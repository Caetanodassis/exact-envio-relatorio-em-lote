# Caixa de e-mail de teste: nada sai para a internet.
# Interface web em http://localhost:8025  |  SMTP em localhost:1025
services:
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
